name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versión a publicar en Releases (ejemplo: 0.0.1). Déjalo vacío para usar la de build.gradle.kts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner de GitHub ya trae el SDK de Android; solo aceptamos las licencias.
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Opcional: si defines los secretos KEYSTORE_B64, KS_PASS, KEY_ALIAS y KEY_PASS,
      # se firma con tu propia llave en lugar de la de la alpha.
      - name: Usar llave propia (si existe)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "PS_KS_PASS=${{ secrets.KS_PASS }}" >> "$GITHUB_ENV"
          echo "PS_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "PS_KEY_PASS=${{ secrets.KEY_PASS }}" >> "$GITHUB_ENV"

      # Decide si esta ejecución publica un release: al subir a la rama principal,
      # al subir una etiqueta v*, o al lanzar el flujo a mano.
      - name: Preparar versión
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          RELEASE=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"; RELEASE=true
          elif [ -n "$INPUT_VERSION" ]; then
            TAG="v$INPUT_VERSION"; RELEASE=true
          else
            TAG="v$VERSION"
            if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then RELEASE=true; fi
          fi
          PRE=false
          case "$VERSION" in 0.*) PRE=true;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Compilar
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Renombrar APKs
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          if [ "$RELEASE" = "true" ]; then V="$TAG"; else V="dev-${GITHUB_SHA::7}"; fi
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release.*\.apk$/\1/')
            cp "$f" "dist/PocketStudio-${V}-${abi}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: PocketStudio-apks
          path: dist/*.apk

      # El release lo crea el propio flujo con su GITHUB_TOKEN (permissions: contents: write).
      - name: Publicar en Releases
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pocket Studio ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          files: dist/*.apk
          generate_release_notes: true
