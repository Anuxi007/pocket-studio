name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versión a publicar en Releases (ejemplo: 0.0.1). Déjalo vacío para solo compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner de GitHub ya trae el SDK de Android; solo aceptamos las licencias.
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Opcional: si defines los secretos KEYSTORE_B64, KS_PASS, KEY_ALIAS y KEY_PASS,
      # se firma con tu propia llave en lugar de la de la alpha.
      - name: Usar llave propia (si existe)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "PS_KS_PASS=${{ secrets.KS_PASS }}" >> "$GITHUB_ENV"
          echo "PS_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "PS_KEY_PASS=${{ secrets.KEY_PASS }}" >> "$GITHUB_ENV"

      - name: Compilar
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Renombrar APKs
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}";
          elif [ -n "${{ inputs.release_version }}" ]; then V="v${{ inputs.release_version }}";
          else V="dev-${GITHUB_SHA::7}"; fi
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release.*\.apk$/\1/')
            cp "$f" "dist/PocketStudio-${V}-${abi}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: PocketStudio-apks
          path: dist/*.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.release_version) }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          prerelease: true
          generate_release_notes: true
